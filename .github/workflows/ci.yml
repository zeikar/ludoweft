name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, plus the newer LTS lines.
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # Ludoweft has no dependencies, so there is nothing to install.
      - run: npm test
      - run: npm run demo
      - run: npm run plugin:smoke
